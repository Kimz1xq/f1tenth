pure_pursuit_node:
  ros__parameters:
    drive_mode: "sim"
    enabled: false

    global_frame_id: "map"
    base_frame_id: "ego_racecar/base_link"
    odom_topic: "/ego_racecar/odom"
    path_topic: "/planning/path"

    sim_drive_topic: "/drive"

    real_speed_topic: "/commands/motor/speed"
    real_servo_topic: "/commands/servo/position"

    wheelbase: 0.33
    lookahead_distance: 0.70
    max_steering_angle: 0.4189
    max_path_distance: 1.00
    max_heading_error: 1.0472  # 60 deg
    search_back_points: 8
    search_forward_points: 30

    # First closed-loop test: deliberately conservative.
    target_speed: 0.60
    min_speed: 0.25
    max_speed: 0.80
    corner_slowdown_gain: 0.55

    speed_to_erpm_gain: 3000.0
    speed_to_erpm_offset: 0.0

    servo_center: 0.5
    servo_gain: 1.0
    servo_min: 0.0
    servo_max: 1.0

    control_rate: 30.0
    odom_timeout: 0.50
    path_timeout: 2.00
