pure_pursuit_node:
  ros__parameters:
    drive_mode: "sim"
    enabled: false

    global_frame_id: "map"
    base_frame_id: "ego_racecar/base_link"
    odom_topic: "/ego_racecar/odom"
    path_topic: "/planning/path"

    # One platform-neutral output in both modes. Gym or the onboard
    # ackermann_mux/VESC stack performs the final actuator conversion.
    drive_topic: "/drive"

    wheelbase: 0.324
    lookahead_distance: 0.70
    max_steering_angle: 0.4189
    max_path_distance: 1.00
    max_heading_error: 1.0472  # 60 deg
    search_back_points: 8
    search_forward_points: 30

    # First closed-loop test: deliberately conservative.
    target_speed: 0.60
    min_speed: 0.25
    max_speed: 0.80
    corner_slowdown_gain: 0.55

    control_rate: 30.0
    odom_timeout: 0.50
    path_timeout: 2.00
