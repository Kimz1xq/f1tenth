waypoint_planner_node:
  ros__parameters:
    # Selected by planning.launch.py; no simulator or map-specific source path.
    waypoint_csv: ""
    path_topic: "/planning/global_path"
    marker_topic: "/planning/markers"
    frame_id: "map"
    publish_rate: 2.0

local_obstacle_planner_node:
  ros__parameters:
    global_path_topic: "/planning/global_path"
    local_path_topic: "/planning/path"
    scan_topic: "/scan"
    map_topic: "/map"
    odom_topic: "/ego_racecar/odom"
    emergency_stop_topic: "/safety/emergency_stop"
    avoidance_active_topic: "/planning/avoidance_active"
    marker_topic: "/planning/local_markers"
    status_topic: "/planning/local_status"
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "ego_racecar/base_link"
    # /scan is 40 Hz and /odom is 50 Hz on the current car. Planning at
    # 20 Hz halves avoidance latency without processing every laser packet.
    planning_rate: 20.0
    scan_process_rate: 20.0
    scan_transform_delay: 0.08

    detection_range: 6.0
    # Ignore small map/scan registration residuals near mapped walls.
    map_endpoint_clearance: 0.36
    map_registration_percentile: 60.0
    map_registration_margin: 0.08
    map_registration_max_extra: 0.25
    cluster_gap: 0.16
    cluster_min_points: 10
    cluster_max_diameter: 0.55
    path_obstacle_corridor: 0.55
    obstacle_memory_seconds: 0.5
    obstacle_confirmation_frames: 3
    obstacle_match_distance: 0.35
    # 0.20 x 0.12 m obstacle footprint의 외접원에 가까운 기본 반경.
    obstacle_default_radius: 0.11
    obstacle_max_radius: 0.12
    obstacle_marker_radius_scale: 1.0
    obstacle_lookahead: 3.2
    # Speed-adaptive horizon = reaction + v^2/(2a) + margin, bounded here.
    maximum_planning_horizon: 6.0
    planning_reaction_time: 0.25
    planning_deceleration: 4.0
    planning_distance_margin: 0.50

    # Candidates derive from measured obstacle geometry, not track positions.
    candidate_offset_spacing: 0.04
    candidate_offset_count: 6
    maximum_candidate_offset: 0.70
    # TUM-style action-set sampling: evaluate the same left/right manoeuvre
    # with several map-independent transition lengths.
    candidate_transition_scales: [1.0, 1.25, 1.50]
    # Extra tracking reserve around the physical 0.58 x 0.31 m footprint.
    # Tune from measured lateral tracking error; no map coordinate is used.
    # Same tracking reserve used by the simulator's passage validator.
    # Vehicle dimensions and the independent wall/obstacle margins are
    # applied separately, so this value must not double-count them.
    candidate_clearance_buffer: 0.03
    avoidance_before_distance: 1.80
    avoidance_after_distance: 1.10
    maximum_avoidance_before_distance: 4.0
    maximum_avoidance_after_distance: 4.0
    avoidance_before_time: 0.75
    avoidance_after_time: 0.40
    path_sample_spacing: 0.04
    # 0.17 m vehicle lateral radius + 0.02 m wall margin.
    map_clearance: 0.18
    vehicle_clearance_radius: 0.17
    vehicle_length: 0.58
    vehicle_width: 0.31
    # Ackermann geometric feasibility: kappa <= tan(delta_max) / wheelbase.
    wheelbase: 0.324
    max_steering_angle: 0.4189
    obstacle_safety_margin: 0.01

    # Performance-oriented AEB: confirmed dense clusters only.  Physical
    # footprint collision and no-feasible-path stops remain unchanged.
    aeb_corridor_half_width: 0.17
    aeb_reaction_time: 0.08
    aeb_max_deceleration: 6.0
    aeb_min_distance: 0.10
    aeb_critical_reaction_time: 0.03
    aeb_confirmation_frames: 3
    scan_timeout: 0.50

    # The controller takes this topic as a limit, not as a fixed avoidance
    # speed. Straights remain fast while curvature sets a physically meaningful
    # limit through a_y = v^2*kappa.
    maximum_planning_speed: 5.5
    minimum_avoidance_speed: 1.00
    max_lateral_acceleration: 1.50
    candidate_curvature_weight: 0.35
    candidate_clearance_weight: 0.10
    curvature_percentile: 85.0
