amcl:
  ros__parameters:
    use_sim_time: false

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: ego_racecar/base_link
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel

    tf_broadcast: true
    transform_tolerance: 0.2
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false

    initial_pose:
      x: 0.2985
      y: 0.5926
      z: 0.0
      yaw: -0.6205

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    update_min_d: 0.05
    update_min_a: 0.05
    save_pose_rate: 0.5

    # The course contains unmapped static obstacles. Use Nav2 AMCL's
    # likelihood-field model with beam skipping so those outlier beams do not
    # drag the map->odom estimate away from the mapped walls.
    laser_model_type: likelihood_field_prob
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    max_beams: 60
    laser_min_range: 0.0
    laser_max_range: 30.0
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
