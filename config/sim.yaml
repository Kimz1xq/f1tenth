bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275
    odom_frame_id: 'odom'
    ground_truth_odom_topic: '/ground_truth/odom'
    sim_reset_topic: '/sim_reset_pose'
    topic_publish_rate: 40.0
    
    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters
    map_path: '/sim_ws/src/f1tenth_gym_ros/maps/track03'
    map_img_ext: '.pgm'
    friction_mu: 1.0489

    # opponent parameters
    num_agent: 1

    # ego starting pose on map
    sx: 0.2985
    sy: 0.5926
    stheta: -0.6205

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True

    # Static-obstacle experiments. A negative seed chooses fresh randomness
    # for every placement; use a non-negative seed for reproducible runs.
    random_obstacles_enabled: false
    random_obstacle_count: 2
    random_obstacle_seed: -1
    randomize_obstacles_on_reset: false
    randomize_obstacles_on_lap: true
    obstacle_path_csv: '/sim_ws/src/planning/waypoints/track03_centerline.csv'
    obstacle_length: 0.20
    obstacle_width: 0.12
    obstacle_height: 0.20
    obstacle_lateral_offset: 0.16
    obstacle_start_clearance: 1.50
    obstacle_min_spacing: 3.00
    obstacle_passage_offset: 0.18
    # Match the local planner's map_clearance so every generated obstacle has
    # at least one passage that the planner can actually accept.
    obstacle_passage_radius: 0.19
    obstacle_marker_topic: '/simulation/obstacles_ground_truth'
    vehicle_length: 0.58
    vehicle_width: 0.31
